<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something is waiting for you</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #0a2540;
      --night-2: #123a63;
      --coral: #ff6b8b;
      --butter: #ffe29a;
      --mint: #7fe5c4;
      --snow: #fff8f0;
      --snow-dim: #b9c7dc;
      --display: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
      --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { background: var(--night); color: var(--snow); -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      font-family: var(--body);
      font-size: 1.1rem;
      line-height: 1.5;
      background:
        radial-gradient(80% 55% at 50% 105%, #2a6bb0 0%, transparent 70%),
        radial-gradient(60% 45% at 50% -5%, #1b3f73 0%, transparent 70%),
        var(--night);
    }

    main {
      width: min(100% - 2.5rem, 52rem);
      padding-block: 3rem;
      text-align: center;
    }

    h1 {
      margin: 0 auto 0.75rem;
      max-width: 18ch;
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(1.5rem, 5vw, 2.6rem);
      line-height: 1.15;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }

    .sub {
      margin: 0 0 clamp(2rem, 6vw, 3.5rem);
      color: var(--snow-dim);
    }

    /* Countdown */
    .clock {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: clamp(0.35rem, 2vw, 1rem);
      font-family: var(--display);
      font-variant-numeric: tabular-nums;
    }

    .unit { display: flex; flex-direction: column; align-items: center; }
    .unit[hidden] + .sep { display: none; }

    .num {
      font-weight: 700;
      font-size: clamp(2.1rem, 11vw, 5.6rem);
      line-height: 1;
      min-width: 2ch;
      letter-spacing: -0.03em;
      transition: color 0.6s ease;
    }

    .label {
      margin-top: 0.7rem;
      font-family: var(--body);
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--snow-dim);
    }

    .sep {
      font-weight: 700;
      font-size: clamp(2.1rem, 11vw, 5.6rem);
      line-height: 1;
      color: var(--coral);
      animation: blink 1s steps(1, end) infinite;
    }

    @keyframes blink { 50% { opacity: 0.2; } }

    /* Reveal */
    .reveal {
      margin-top: clamp(2.25rem, 7vw, 3.5rem);
      min-height: 4.5rem;
    }

    .btn {
      display: inline-block;
      padding: 1.05rem 2.6rem;
      border-radius: 999px;
      background: var(--coral);
      color: var(--night);
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.05rem;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(255, 107, 139, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(255, 107, 139, 0.5); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: 3px solid var(--butter); outline-offset: 4px; }

    .btn.pop { animation: pop 0.7s cubic-bezier(0.2, 1.4, 0.4, 1) both; }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.6) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Countdown finished */
    body.done .num { color: var(--butter); }
    body.done .sep { animation: none; opacity: 1; color: var(--mint); }

    #confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    @media (prefers-reduced-motion: reduce) {
      .sep { animation: none; }
      .btn.pop { animation: none; }
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main>
    <h1 id="title">Something is waiting for you</h1>
    <p class="sub" id="sub"></p>

    <div class="clock" role="timer" aria-label="Countdown">
      <div class="unit" id="u-days" hidden><span class="num" id="days">00</span><span class="label">days</span></div>
      <span class="sep" aria-hidden="true">:</span>
      <div class="unit"><span class="num" id="hours">00</span><span class="label">hours</span></div>
      <span class="sep" aria-hidden="true">:</span>
      <div class="unit"><span class="num" id="mins">00</span><span class="label">minutes</span></div>
      <span class="sep" aria-hidden="true">:</span>
      <div class="unit"><span class="num" id="secs">00</span><span class="label">seconds</span></div>
    </div>

    <div class="reveal">
      <a class="btn" id="btn" href="main.html" hidden>Click here</a>
    </div>
    <noscript><p class="sub">This page needs JavaScript to run the countdown.</p></noscript>
  </main>

  <script>
    /* ---------- EDIT THESE ---------- */
    var CONFIG = {
      friendName: "Your Friend",
      // 20 Sep 2026, 8:45 PM. No timezone = the clock on the viewer's device.
      unlockAt: "2026-09-20T20:45:00",
      // The page the button opens (your main page)
      buttonLink: "main.html",
      buttonText: "Click here"
    };
    /* -------------------------------- */

    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var params = new URLSearchParams(location.search);

      // ?test=10 runs a 10-second countdown so you can try it
      var testSeconds = parseInt(params.get("test"), 10);
      var target = testSeconds > 0 ? Date.now() + testSeconds * 1000 : new Date(CONFIG.unlockAt).getTime();

      $("title").textContent = "Something is waiting for " + CONFIG.friendName;
      document.title = "Something is waiting for " + CONFIG.friendName;
      $("sub").textContent = "It unlocks on " + new Date(target).toLocaleString(undefined, {
        dateStyle: "long", timeStyle: "short"
      });

      var btn = $("btn");
      btn.href = CONFIG.buttonLink;
      btn.textContent = CONFIG.buttonText;

      var els = { days: $("days"), hours: $("hours"), mins: $("mins"), secs: $("secs") };
      var daysUnit = $("u-days");
      function pad(n) { return String(n).padStart(2, "0"); }

      var finished = false;
      var timer;

      function finish(animate) {
        finished = true;
        clearInterval(timer);
        document.body.classList.add("done");
        $("title").textContent = "Happy birthday, " + CONFIG.friendName + "!";
        $("sub").textContent = "Your surprise is ready.";
        btn.hidden = false;
        if (animate) {
          btn.classList.add("pop");
          confetti();
        }
      }

      function tick() {
        var left = Math.max(0, target - Date.now());
        var s = Math.floor(left / 1000);
        var d = Math.floor(s / 86400);
        daysUnit.hidden = d === 0;
        els.days.textContent = pad(d);
        els.hours.textContent = pad(Math.floor((s % 86400) / 3600));
        els.mins.textContent = pad(Math.floor((s % 3600) / 60));
        els.secs.textContent = pad(s % 60);
        if (left === 0 && !finished) finish(true);
      }

      function confetti() {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var c = $("confetti");
        var ctx = c.getContext("2d");
        var dpr = window.devicePixelRatio || 1;
        var w = (c.width = window.innerWidth * dpr);
        var h = (c.height = window.innerHeight * dpr);
        var colors = ["#ff6b8b", "#ffe29a", "#7fe5c4", "#fff8f0"];
        var bits = [];
        for (var i = 0; i < 150; i++) {
          bits.push({
            x: Math.random() * w,
            y: -Math.random() * h * 0.6,
            r: (4 + Math.random() * 6) * dpr,
            vx: (Math.random() - 0.5) * 2 * dpr,
            vy: (2 + Math.random() * 3) * dpr,
            rot: Math.random() * 6.28,
            vr: (Math.random() - 0.5) * 0.2,
            c: colors[Math.floor(Math.random() * colors.length)]
          });
        }
        var start = performance.now();
        function frame(now) {
          ctx.clearRect(0, 0, w, h);
          var alive = false;
          bits.forEach(function (p) {
            p.x += p.vx; p.y += p.vy; p.rot += p.vr;
            if (p.y < h + 20 * dpr) alive = true;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.c;
            ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
            ctx.restore();
          });
          if (alive && now - start < 7000) requestAnimationFrame(frame);
          else ctx.clearRect(0, 0, w, h);
        }
        requestAnimationFrame(frame);
      }

      tick();
      if (!finished) timer = setInterval(tick, 250);
    })();
  </script>
</body>
</html>
